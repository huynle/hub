<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111317" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voice" />
    <title>OpenCode Voice</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="bar">
      <button id="back" class="icon-btn" type="button" aria-label="Back to sessions" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <h1 id="heading">OpenCode Voice</h1>
      <span id="conn" class="conn" role="status" aria-label="Connecting">
        <span class="conn-dot" aria-hidden="true"></span><span id="conn-text">connecting</span>
      </span>
      <button id="notify" class="pill" type="button" aria-label="Enable notifications" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
        <span class="pill-label">Enable notifications</span>
      </button>
      <button id="settings" class="icon-btn" type="button" aria-label="Settings" aria-haspopup="dialog" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" />
        </svg>
        <span id="settings-badge" class="badge" hidden></span>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">Settings</h2>
        <button id="sheet-close" class="icon-btn" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div id="sheet-body"></div>
    </dialog>

    <dialog id="mini" class="sheet mini" aria-labelledby="mini-title">
      <div class="sheet-head">
        <h2 id="mini-title"></h2>
        <button id="mini-close" class="icon-btn" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div id="mini-body"></div>
    </dialog>

    <dialog id="picker" class="sheet picker" aria-labelledby="picker-title">
      <div class="sheet-head">
        <h2 id="picker-title"></h2>
        <button id="picker-close" class="icon-btn" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="picker-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14z" /><path d="M20 20l-4-4" /></svg>
        <input id="picker-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="true"
          aria-controls="picker-list" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" />
      </div>
      <div class="picker-status"><p id="picker-status" class="small muted" role="status" aria-live="polite"></p><button id="picker-retry" class="btn small" type="button" hidden>Retry</button></div>
      <ul id="picker-list" class="picker-list" role="listbox" aria-labelledby="picker-title"></ul>
    </dialog>

    <audio id="player" preload="none"></audio>
    <noscript>OpenCode Voice needs JavaScript.</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
