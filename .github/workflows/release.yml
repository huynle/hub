name: Release
# Push a tag vX.Y.Z (matching package.json) to publish: standalone hub binaries + SHA256SUMS on the
# GitHub Release, the hub image ghcr.io/<owner>/opencode-hub (linux/amd64 + linux/arm64), and the npm
# package @huynle/opencode-hub through npm trusted publishing (OIDC; no token).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: scripts/test-ci.sh

  binaries:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, windows-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # Cross-compiles from Linux: bun fetches the runtime for each --target.
      - run: scripts/build-binaries.sh ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target == 'linux-x64'
        run: ./dist/opencode-hub-linux-x64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.target }}
          path: dist/opencode-hub-*
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hub-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          chmod +x opencode-hub-*
          sha256sum opencode-hub-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/opencode-hub-*
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opencode-hub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=opencode-hub
            org.opencontainers.image.description=OpenCode Hub: remote console, pairing, push and optional Voice for OpenCode sessions
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    # Trusted publishing (OIDC): npm trusts this workflow (huynle/opencode-hub, release.yml), so there is no
    # token to store or leak, and npm adds provenance automatically. Needs npm >= 11.5.1 and Node >= 22.14.
    # The trusted publisher is configured per package on npmjs.com (package settings), so a new package
    # name needs one manual first publish before this job can publish it.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - name: Skip versions already on npm
        id: check
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$spec is already on npm; skipping."
          fi
      - if: steps.check.outputs.already != 'true'
        run: npm publish --access public ${{ contains(github.ref_name, '-') && '--tag next' || '' }}
