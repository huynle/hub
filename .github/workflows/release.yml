name: Release
# Push a tag vX.Y.Z (matching package.json) to publish: standalone hub binaries + SHA256SUMS on the
# GitHub Release, the hub image ghcr.io/<owner>/hub (linux/amd64 + linux/arm64), and the npm
# package @huynle/hub through npm trusted publishing (OIDC; no token).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: scripts/test-ci.sh

  binaries:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, windows-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # Cross-compiles from Linux: bun fetches the runtime for each --target.
      - run: scripts/build-binaries.sh ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target == 'linux-x64'
        run: ./dist/hub-linux-x64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.target }}
          path: dist/hub-*
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hub-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          chmod +x hub-*
          sha256sum hub-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hub-*
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=hub
            org.opencontainers.image.description=Hub: a central hub for AI agent harnesses (OpenCode first): remote console, pairing, push and optional Voice
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    # Trusted publishing (OIDC): npm trusts this workflow (huynle/hub, release.yml), so there is no
    # token to store or leak, and npm adds provenance automatically. Needs npm >= 11.5.1 and Node >= 22.14.
    # The trusted publisher is configured per package on npmjs.com (package settings), so a new package
    # name needs one manual first publish before this job can publish it.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # prepack also bundles the CLI (packages/cli/dist/hub-cli.js) with bun build.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: npm install -g npm@^11.5.1
      # prepack builds the web app (web/dist), which needs the dev dependencies.
      - run: npm ci --no-audit --no-fund
      - name: Skip versions already on npm
        id: check
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$spec is already on npm; skipping."
          fi
      - if: steps.check.outputs.already != 'true'
        run: npm publish --access public ${{ contains(github.ref_name, '-') && '--tag next' || '' }}

  # ---------- standalone hubctl (packages/cli/src/bootstrap/release/README.md) ----------
  # Additive: the server binaries, image and npm package above are unchanged. Enabled by the repository variable
  # HUBCTL_RELEASE=true once the release key exists and its public trust root is checked in
  # (packages/cli/src/bootstrap/release/trust-root.json). hubctl is published only after the existing gates
  # (test → binaries → release) pass, and only with a manifest that verifies against the embedded trust root.
  hubctl:
    needs: test
    if: vars.HUBCTL_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # Every supported target (contracts §3.1; never Windows or musl), cross-compiled from Linux, each with the
      # checked-in trust root embedded. Fails when there is none.
      - run: scripts/build-hubctl.sh --require-trust-root
      - name: Smoke test (no bun, node or repository on PATH)
        run: |
          smoke="$(mktemp -d)"
          cp dist/hubctl-linux-x64 "$smoke/hubctl"
          ln -s hubctl "$smoke/hub"
          cd "$smoke"
          version="$(env -i PATH=/nonexistent HOME="$smoke" ./hubctl --version)"
          expected="$(node -p "require('$GITHUB_WORKSPACE/packages/cli/package.json').version")"
          if [ "$version" != "$expected" ]; then
            echo "::error::hubctl --version printed '$version', expected '$expected'"
            exit 1
          fi
          env -i PATH=/nonexistent HOME="$smoke" ./hubctl --help > hubctl-help.txt
          env -i PATH=/nonexistent HOME="$smoke" ./hub --help > hub-help.txt
          cmp hubctl-help.txt hub-help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hubctl-binaries
          path: |
            dist/hubctl-*
            dist/HUBCTL_SHA256SUMS
          if-no-files-found: error

  hubctl-sign:
    # The only job that can read the release signing key (decision Q5): an environment secret of
    # `hubctl-release`. It installs no npm dependencies, so no third-party code runs next to the key.
    needs: hubctl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hubctl-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/download-artifact@v4
        with:
          name: hubctl-binaries
          path: dist
      # Re-downloads and digests every reviewed harness pin; refuses on any mismatch.
      - name: Manifest
        env:
          MINIMUM_VERSION: ${{ vars.HUBCTL_MINIMUM_VERSION || '0.0.0' }}
        run: |
          issued="$(( $(git log -1 --format=%ct) * 1000 ))"
          bun scripts/hubctl-release.ts manifest --dist dist --minimum-version "$MINIMUM_VERSION" --issued-at "$issued" --out "$RUNNER_TEMP/hubctl-manifest.unsigned.json"
      - name: Sign
        env:
          HUB_RELEASE_SIGNING_KEY: ${{ secrets.HUB_RELEASE_SIGNING_KEY }}
        run: bun scripts/hubctl-release.ts sign --in "$RUNNER_TEMP/hubctl-manifest.unsigned.json" --out dist/hubctl-manifest.json
      - name: Verify every artifact against the embedded trust root
        run: bun scripts/hubctl-release.ts verify --manifest dist/hubctl-manifest.json --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: hubctl-release
          path: |
            dist/hubctl-*
            dist/HUBCTL_SHA256SUMS
          if-no-files-found: error

  hubctl-publish:
    # After the existing release job (so after test and the server binaries) and the verified signature.
    needs: [release, hubctl-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/download-artifact@v4
        with:
          name: hubctl-release
          path: dist
      # The files about to be published, checked again against the trust root the binaries embed.
      - run: bun scripts/hubctl-release.ts verify --manifest dist/hubctl-manifest.json --dist dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hubctl-*
            dist/HUBCTL_SHA256SUMS
          prerelease: ${{ contains(github.ref_name, '-') }}
