# TEMPLATE ONLY: not in kustomization.yaml. Copy it, fill in the values outside Git (or encrypt the copy with SOPS,
# see flux/hub.yaml), and create the Secret `hub` in the `hub` namespace. Never commit real values.
#
# HUB_TOKEN_KEYS signs session tokens and must be the same on every pod. Moving from a single-process hub, print the
# old keys with `hub-server import --state <dir> --print-token-keys` (stdout holds only the value), so tokens it
# issued keep working. For a new hub, make one:
#   bun -e 'const s = Buffer.from(crypto.getRandomValues(new Uint8Array(32))).toString("base64"); console.log(JSON.stringify({active: "k1", keys: [{kid: "k1", secret: s, created: Date.now()}]}))'
apiVersion: v1
kind: Secret
metadata:
  name: hub
  labels:
    app.kubernetes.io/name: hub
type: Opaque
stringData:
  # postgres:// or postgresql://; add ?sslmode=require (or verify-full) when the database is not on a trusted network.
  HUB_DATABASE_URL: "postgres://hub:REPLACE_ME@postgres.databases.svc:5432/hub"
  # redis://, rediss://, valkey:// or valkeys://; the user needs an ACL allowing the hub's commands (see docs/cluster.md).
  HUB_VALKEY_URL: "redis://hub:REPLACE_ME@valkey.databases.svc:6379/0"
  HUB_TOKEN_KEYS: '{"active":"REPLACE_ME","keys":[{"kid":"REPLACE_ME","secret":"REPLACE_ME_BASE64_32_BYTES","created":0}]}'
  HUB_OIDC_CLIENT_ID: "REPLACE_ME.apps.googleusercontent.com"
  HUB_OIDC_CLIENT_SECRET: "REPLACE_ME"
  # Optional: default key of the openrouter speech provider.
  # OPENROUTER_API_KEY: "REPLACE_ME"
