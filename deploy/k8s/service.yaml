apiVersion: v1
kind: Service
metadata:
  name: hub
  labels:
    app.kubernetes.io/name: hub
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  # Any pod serves any request (shared state, cross-pod routing): no affinity.
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: hub
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
